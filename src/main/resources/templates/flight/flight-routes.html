<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>노선 보기 | Travel Money</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/common/common.css">
  <link rel="stylesheet" href="/css/flight/flight-routes.css">
</head>

<body class="tm-body">

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main class="route-page">

  <section class="route-compact-hero">
    <div class="route-wide-container">
      <div class="route-compact-hero-inner">
        <div>
          <p class="tm-eyebrow">FLIGHT ROUTE</p>
          <h1>노선 보기</h1>
          <p>
            출발지와 도착지를 선택해 이용 가능한 항공 노선, 최저가, 직항/경유 여부를 확인합니다.
          </p>
        </div>

        <div class="route-hero-mini-info">
          <div>
            <strong>Route</strong>
            <span>노선 확인</span>
          </div>
          <div>
            <strong>Price</strong>
            <span>최저가 비교</span>
          </div>
          <div>
            <strong>Move</strong>
            <span>검색 이동</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="route-workspace-section">
    <div class="route-wide-container">

      <div class="route-workspace-layout">

        <aside class="route-sidebar">
          <section class="route-search-box">
            <div class="route-search-header">
              <p class="tm-eyebrow">SEARCH</p>
              <h2>노선 검색 조건</h2>
              <p>출발지와 도착지를 선택해서 해당 노선을 확인합니다.</p>
            </div>

            <section class="route-select-section">
              <div class="route-section-heading">
                <span>01</span>
                <h3>출발지</h3>
              </div>

              <div class="route-select-grid">
                <div class="route-input-group">
                  <label for="originCountrySelect">출발 국가</label>
                  <select id="originCountrySelect"></select>
                </div>

                <div class="route-input-group">
                  <label for="originCitySelect">출발 도시</label>
                  <select id="originCitySelect"></select>
                </div>

                <div class="route-input-group route-airport-group">
                  <label>출발 공항</label>
                  <div id="originAirportList" class="airport-radio-list"></div>
                </div>
              </div>
            </section>

            <section class="route-select-section">
              <div class="route-section-heading">
                <span>02</span>
                <h3>도착지</h3>
              </div>

              <div class="route-select-grid">
                <div class="route-input-group">
                  <label for="destinationCountrySelect">도착 국가</label>
                  <select id="destinationCountrySelect"></select>
                </div>

                <div class="route-input-group">
                  <label for="destinationCitySelect">도착 도시</label>
                  <select id="destinationCitySelect"></select>
                </div>

                <div class="route-input-group route-airport-group">
                  <label>도착 공항</label>
                  <div id="destinationAirportList" class="airport-radio-list"></div>
                </div>
              </div>
            </section>

            <div class="route-search-actions">
              <button type="button" id="routeSearchButton" class="route-search-button">
                노선 검색
              </button>

              <button type="button" id="routeResetButton" class="route-reset-button">
                전체 노선 보기
              </button>
            </div>
          </section>
        </aside>

        <section class="route-result-content">
          <section class="route-result-section">
            <div class="route-section-title">
              <div>
                <p class="tm-eyebrow">ROUTE LIST</p>
                <h2>노선 목록</h2>
                <p id="routeCountText">노선 정보를 불러오는 중입니다.</p>
              </div>
            </div>

            <div id="routeList" class="route-list"></div>
          </section>
        </section>

      </div>

    </div>
  </section>

</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/flight/flight-routes.js"></script>

</body>
</html>
