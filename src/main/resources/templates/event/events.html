<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>월별 이벤트 목록 | Travel Money</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/common.css}">
  <link rel="stylesheet" th:href="@{/css/events.css}">
</head>

<body>

<!-- 공통 header fragment 경로는 네 프로젝트 구조에 맞게 수정 -->
<!-- 예: templates/fragments/header.html 이면 아래처럼 사용 -->
<!-- <div th:replace="~{fragments/header :: header}"></div> -->

<main class="event-page">

  <section class="event-hero">
    <div class="container">
      <p class="event-hero-label">Travel Events</p>
      <h1>월별 이벤트 목록</h1>
      <p>
        대륙, 국가, 도시를 선택하면 해당 도시의 월별 축제, 명절, 시즌 이벤트를 확인할 수 있습니다.
        이벤트는 여행 시기 추천 점수에는 반영되지 않고, 참고 정보로 제공됩니다.
      </p>
    </div>
  </section>

  <div class="container event-container">

    <section class="event-search-section">
      <div class="event-search-card">
        <div class="event-search-header">
          <div>
            <h2>이벤트 조회</h2>
            <p>대륙, 국가, 도시, 월을 선택해서 등록된 여행 이벤트를 확인합니다.</p>
          </div>
        </div>

        <div class="row g-3 align-items-end">

          <div class="col-md-3">
            <label for="regionSelect" class="form-label">대륙</label>
            <select id="regionSelect" class="form-select">
              <option value="">대륙을 선택하세요</option>
            </select>
          </div>

          <div class="col-md-3">
            <label for="countrySelect" class="form-label">국가</label>
            <select id="countrySelect" class="form-select" disabled>
              <option value="">먼저 대륙을 선택하세요</option>
            </select>
          </div>

          <div class="col-md-2">
            <label for="citySelect" class="form-label">도시</label>
            <select id="citySelect" class="form-select" disabled>
              <option value="">먼저 국가를 선택하세요</option>
            </select>
          </div>

          <div class="col-md-2">
            <label for="monthSelect" class="form-label">월</label>
            <select id="monthSelect" class="form-select">
              <option value="">전체 월</option>
              <option value="1">1월</option>
              <option value="2">2월</option>
              <option value="3">3월</option>
              <option value="4">4월</option>
              <option value="5">5월</option>
              <option value="6">6월</option>
              <option value="7">7월</option>
              <option value="8">8월</option>
              <option value="9">9월</option>
              <option value="10">10월</option>
              <option value="11">11월</option>
              <option value="12">12월</option>
            </select>
          </div>

          <div class="col-md-2">
            <button type="button" id="searchEventBtn" class="btn btn-primary w-100">
              조회
            </button>
          </div>

        </div>
      </div>
    </section>

    <div id="eventStatusMessage" class="alert d-none event-status"></div>

    <section id="eventSummaryArea" class="event-summary-section d-none">
      <div class="event-summary-card">
        <div>
          <p class="event-summary-label">Event Calendar</p>
          <h2 id="eventSummaryTitle">이벤트 목록</h2>
          <p id="eventSummaryInfo"></p>
        </div>
      </div>
    </section>

    <section class="event-list-section">
      <div class="event-section-title">
        <h2>이벤트 목록</h2>
        <p>
          선택한 도시의 월별 이벤트를 보여줍니다.
          참고 링크가 있는 경우 이벤트 카드 하단에서 확인할 수 있습니다.
        </p>
      </div>

      <div id="eventMonthList" class="event-month-list">
        <div class="event-empty-box">
          대륙, 국가, 도시를 선택한 뒤 이벤트를 조회해 주세요.
        </div>
      </div>
    </section>

  </div>

</main>

<script th:src="@{/js/events.js}"></script>
</body>
</html>
